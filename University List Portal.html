<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Atlas</title>
<style>
  /* Layout: narrow centered column; search bar on top, results as a ruled list with name / website / state columns */
  :root {
    --bg: #f5f7f8;
    --surface: #ffffff;
    --fg: #14232b;
    --muted: #5c6b73;
    --line: #dbe2e6;
    --accent: #0b6e82;
    --accent-fg: #ffffff;
    --accent-soft: #e1f1f4;
    --danger: #a3341f;
    --danger-soft: #fbe9e5;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1b21; --surface: #16262e; --fg: #e6eef1; --muted: #93a5ad;
      --line: #28404a; --accent: #4cc3d9; --accent-fg: #07222a; --accent-soft: #17343d;
      --danger: #f08a73; --danger-soft: #3a2019; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1b21; --surface: #16262e; --fg: #e6eef1; --muted: #93a5ad;
    --line: #28404a; --accent: #4cc3d9; --accent-fg: #07222a; --accent-soft: #17343d;
    --danger: #f08a73; --danger-soft: #3a2019; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding-block: 48px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 2.75rem);
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .lede { margin: 0 0 28px; color: var(--muted); max-width: 60ch; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { flex: 1 1 260px; min-width: 0; }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input[type="text"], input[type="search"] {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  input::placeholder { color: var(--muted); }
  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    padding: 12px 22px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-fg);
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .quick { margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.875rem; }
  .quick button {
    padding: 4px 12px; font-weight: 500; font-size: 0.875rem;
    background: var(--surface); color: var(--fg); border-color: var(--line);
  }
  .quick button:hover { border-color: var(--accent); }

  .status { margin-top: 32px; }
  .notice {
    padding: 14px 16px; border-radius: 8px;
    background: var(--accent-soft); border: 1px solid var(--line);
  }
  .notice.error { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

  .toolbar {
    margin-top: 32px;
    display: flex; gap: 12px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  }
  .count { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
  .count small { font-family: var(--font-body); color: var(--muted); font-size: 0.875rem; }
  .toolbar .field { flex: 0 1 280px; }

  .table-scroll { margin-top: 12px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--line); }
  th {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; background: var(--bg);
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 600; }
  td a { color: var(--accent); overflow-wrap: anywhere; }
  td.state { color: var(--muted); }
  td.state.none { opacity: 0.7; }
  .footnote { margin-top: 24px; color: var(--muted); font-size: 0.8125rem; }
  .footnote a { color: var(--accent); }

  @media (prefers-reduced-motion: no-preference) {
    button { transition: background-color 0.15s, border-color 0.15s; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
</head>
<body>
<main class="wrap">
  <h1>Campus Atlas</h1>
  <p class="lede">Type a country to see its universities, with each one's website and state or province.</p>

  <form id="search-form" autocomplete="off">
    <div class="field">
      <label class="sr" for="country">Country</label>
      <input id="country" type="text" placeholder="Country, for example India" list="country-list" required>
      <datalist id="country-list"></datalist>
    </div>
    <button id="go" type="submit">Find universities</button>
  </form>

  <div class="quick" id="quick" aria-label="Example countries">
    <span>Try:</span>
  </div>

  <div class="status" id="status" role="status" aria-live="polite" hidden></div>

  <section id="results" hidden>
    <div class="toolbar">
      <h2 class="count" id="count"></h2>
      <div class="field">
        <label class="sr" for="filter">Filter results</label>
        <input id="filter" type="search" placeholder="Filter by name or state">
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th scope="col">University</th><th scope="col">Website</th><th scope="col">State / Province</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p class="footnote">Data comes live from the <a href="https://github.com/Hipo/university-domains-list" target="_blank" rel="noopener">Hipo University Domains List</a> API. Some universities have no state listed.</p>
</main>

<script>
(function () {
  // The single place to change if the API address ever moves.
  var API_URL = "http://universities.hipolabs.com/search";
  var SUGGESTIONS = ["India", "United States", "United Kingdom", "Canada", "Australia", "Germany", "Japan", "Brazil"];

  var form = document.getElementById("search-form");
  var input = document.getElementById("country");
  var goBtn = document.getElementById("go");
  var statusEl = document.getElementById("status");
  var resultsEl = document.getElementById("results");
  var countEl = document.getElementById("count");
  var rowsEl = document.getElementById("rows");
  var filterEl = document.getElementById("filter");
  var quickEl = document.getElementById("quick");
  var listEl = document.getElementById("country-list");

  var current = [];      // normalised records for the last successful search
  var currentCountry = "";
  var requestId = 0;     // guards against out-of-order responses

  SUGGESTIONS.forEach(function (name) {
    var opt = document.createElement("option");
    opt.value = name;
    listEl.appendChild(opt);

    var b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.addEventListener("click", function () {
      input.value = name;
      search(name);
    });
    quickEl.appendChild(b);
  });

  function normalise(raw) {
    var site = Array.isArray(raw.web_pages) && raw.web_pages.length ? String(raw.web_pages[0]) : "";
    if (!/^https?:\/\//i.test(site)) site = "";
    var state = raw["state-province"];
    return {
      name: String(raw.name || "Unnamed institution"),
      website: site,
      state: state ? String(state) : ""
    };
  }

  function showStatus(message, isError) {
    statusEl.hidden = false;
    statusEl.textContent = "";
    var box = document.createElement("div");
    box.className = "notice" + (isError ? " error" : "");
    box.textContent = message;
    statusEl.appendChild(box);
  }
  function clearStatus() { statusEl.hidden = true; statusEl.textContent = ""; }

  function render() {
    var q = filterEl.value.trim().toLowerCase();
    var shown = current.filter(function (u) {
      return !q || u.name.toLowerCase().indexOf(q) !== -1 || u.state.toLowerCase().indexOf(q) !== -1;
    });

    countEl.textContent = "";
    countEl.appendChild(document.createTextNode(
      shown.length + (shown.length === 1 ? " university" : " universities") + " in " + currentCountry + " "
    ));
    if (q) {
      var small = document.createElement("small");
      small.textContent = "(filtered from " + current.length + ")";
      countEl.appendChild(small);
    }

    rowsEl.textContent = "";
    if (!shown.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 3;
      td.textContent = "No universities match that filter.";
      tr.appendChild(td);
      rowsEl.appendChild(tr);
      return;
    }

    var frag = document.createDocumentFragment();
    shown.forEach(function (u) {
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.className = "name";
      tdName.textContent = u.name;

      var tdSite = document.createElement("td");
      if (u.website) {
        var a = document.createElement("a");
        a.href = u.website;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = u.website.replace(/^https?:\/\//i, "").replace(/\/$/, "");
        tdSite.appendChild(a);
      } else {
        tdSite.textContent = "Not listed";
        tdSite.style.color = "var(--muted)";
      }

      var tdState = document.createElement("td");
      tdState.className = "state" + (u.state ? "" : " none");
      tdState.textContent = u.state || "Not listed";

      tr.appendChild(tdName);
      tr.appendChild(tdSite);
      tr.appendChild(tdState);
      frag.appendChild(tr);
    });
    rowsEl.appendChild(frag);
  }

  function search(country) {
    country = country.trim();
    if (!country) return;
    var id = ++requestId;

    goBtn.disabled = true;
    resultsEl.hidden = true;
    showStatus("Loading universities in " + country + "…", false);

    fetch(API_URL + "?country=" + encodeURIComponent(country))
      .then(function (res) {
        if (!res.ok) throw new Error("The server answered with status " + res.status + ".");
        return res.json();
      })
      .then(function (data) {
        if (id !== requestId) return;
        if (!Array.isArray(data)) throw new Error("The server sent an unexpected response.");

        if (!data.length) {
          current = [];
          showStatus("No universities found for “" + country + "”. Check the spelling and use the full English country name, for example “United States”.", true);
          return;
        }

        current = data.map(normalise).sort(function (a, b) { return a.name.localeCompare(b.name); });
        currentCountry = data[0].country || country;
        filterEl.value = "";
        clearStatus();
        resultsEl.hidden = false;
        render();
      })
      .catch(function (err) {
        if (id !== requestId) return;
        showStatus("Could not load universities. " + (err && err.message ? err.message : "") + " Check your internet connection and try again.", true);
      })
      .then(function () {
        if (id === requestId) goBtn.disabled = false;
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    search(input.value);
  });
  filterEl.addEventListener("input", render);
})();
</script>
</body>
</html>
