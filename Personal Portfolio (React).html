<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aditya | Front-End Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030712;--card:#0d1424;--text:#e5e7eb;--muted:#9ca3af;--primary:#6366F1;--secondary:#06B6D4;--accent:#8B5CF6;--border:#1f2937;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030712;--card:#0d1424;--text:#e5e7eb;--muted:#9ca3af;--border:#1f2937;color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#475569;--border:#e2e8f0;color-scheme:light}}
:root[data-theme="dark"]{--bg:#030712;--card:#0d1424;--text:#e5e7eb;--muted:#9ca3af;--border:#1f2937;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;margin:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
nav .links{display:flex;gap:18px;font-size:.95rem;color:var(--muted);overflow-x:auto}
nav .links a:hover{color:var(--secondary)}
.logo{font-family:Poppins,sans-serif;font-weight:700}
section{padding:72px 0 24px}
.hero{padding-top:96px}
.grad{background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.1}
.hero p{max-width:560px;color:var(--muted);font-size:1.1rem}
.btn{display:inline-block;padding:10px 20px;border-radius:10px;font-weight:500;border:1px solid var(--border);margin-right:10px;margin-top:8px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn:hover{border-color:var(--secondary)}
h2{font-size:1.8rem;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--primary)}
.card p{color:var(--muted);margin:8px 0 12px}
.tag{font-size:.8rem;color:var(--secondary);margin-right:8px}
form{display:grid;gap:12px;max-width:520px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--primary)}
footer{margin-top:72px;padding:24px 0;border-top:1px solid var(--border);color:var(--muted);text-align:center;font-size:.9rem}
.fade{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.fade.in{opacity:1;transform:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.0/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ✏️ Edit your content here
const DATA = {
  name: "Aditya",
  role: "Front-End Developer",
  tagline: "I build fast, accessible and polished web interfaces with React.",
  about: "I’m a front-end developer who loves turning ideas into clean, responsive products. I care about performance, thoughtful design systems and code that’s easy to maintain.",
  skills: ["React", "JavaScript", "TypeScript", "Tailwind CSS", "Vite", "Firebase", "Framer Motion", "Git"],
  projects: [
    { title: "College Bus Live Tracking", desc: "Real-time bus location tracking for students with live maps and ETAs.", tags: ["React", "Maps", "Realtime"], link: "#" },
    { title: "Student Placement Portal", desc: "Portal for students and recruiters to manage applications and drives.", tags: ["React", "Firebase", "Admin"], link: "#" },
    { title: "Developer Portfolio", desc: "This site: a component-driven portfolio with a clean design system.", tags: ["React", "Vite", "CSS"], link: "#" },
  ],
  email: "you@example.com",
  socials: [["GitHub", "https://github.com/"], ["LinkedIn", "https://linkedin.com/"]],
};

function Reveal({ children }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }, { threshold: 0.1 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} className={"fade" + (shown ? " in" : "")}>{children}</div>;
}

function Nav() {
  return (
    <nav><div className="wrap">
      <a href="#top" className="logo grad">{DATA.name}</a>
      <div className="links">
        {["about", "skills", "projects", "contact"].map(s => <a key={s} href={"#" + s}>{s[0].toUpperCase() + s.slice(1)}</a>)}
      </div>
    </div></nav>
  );
}

function Hero() {
  return (
    <section className="hero" id="top"><div className="wrap">
      <p style={{ color: "var(--secondary)", margin: 0 }}>Hi, I’m {DATA.name} 👋</p>
      <h1>{DATA.role} <span className="grad">crafting great UIs</span></h1>
      <p>{DATA.tagline}</p>
      <a className="btn pri" href="#projects">View my work</a>
      <a className="btn" href="#contact">Get in touch</a>
    </div></section>
  );
}

function About() {
  return <section id="about"><div className="wrap"><Reveal><h2>About</h2><p style={{ maxWidth: 640, color: "var(--muted)" }}>{DATA.about}</p></Reveal></div></section>;
}

function Skills() {
  return (
    <section id="skills"><div className="wrap"><Reveal>
      <h2>Skills</h2>
      <div className="chips">{DATA.skills.map(s => <span className="chip" key={s}>{s}</span>)}</div>
    </Reveal></div></section>
  );
}

function Projects() {
  return (
    <section id="projects"><div className="wrap">
      <h2>Projects</h2>
      <div className="grid">
        {DATA.projects.map(p => (
          <Reveal key={p.title}>
            <a href={p.link} className="card" style={{ display: "block" }}>
              <h3 style={{ fontSize: "1.15rem" }}>{p.title}</h3>
              <p>{p.desc}</p>
              {p.tags.map(t => <span className="tag" key={t}>#{t}</span>)}
            </a>
          </Reveal>
        ))}
      </div>
    </div></section>
  );
}

function Contact() {
  const [f, setF] = useState({ name: "", message: "" });
  const [sent, setSent] = useState(false);
  const onSubmit = () => {
    if (!f.name.trim() || !f.message.trim()) return;
    window.location.href = `mailto:${DATA.email}?subject=${encodeURIComponent("Hello from " + f.name)}&body=${encodeURIComponent(f.message)}`;
    setSent(true);
  };
  return (
    <section id="contact"><div className="wrap"><Reveal>
      <h2>Contact</h2>
      <form onSubmit={e => e.preventDefault()}>
        <input placeholder="Your name" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} />
        <textarea rows="4" placeholder="Your message" value={f.message} onChange={e => setF({ ...f, message: e.target.value })} />
        <div><button type="button" className="btn pri" onClick={onSubmit} style={{ cursor: "pointer", font: "inherit" }}>Send message</button>
          {sent && <span style={{ color: "var(--secondary)" }}>Opening your email app…</span>}</div>
      </form>
      <p style={{ marginTop: 20 }}>{DATA.socials.map(([n, u]) => <a key={n} className="btn" href={u} target="_blank" rel="noopener">{n}</a>)}</p>
    </Reveal></div></section>
  );
}

function App() {
  return (
    <>
      <Nav /><Hero /><About /><Skills /><Projects /><Contact />
      <footer><div className="wrap">© {new Date().getFullYear()} {DATA.name}. Built with React.</div></footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
