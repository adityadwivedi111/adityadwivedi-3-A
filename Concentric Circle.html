
<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: lightgray;
        }

        .circle1 {
            width: 60px;
            height: 60px;
            background-color: red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle2 {
            width: 40px;
            height: 40px;
            background-color: yellow;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle3 {
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="circle1">
        <div class="circle2">
            <div class="circle3"></div>
        </div>
    </div>

</body>
</html>
