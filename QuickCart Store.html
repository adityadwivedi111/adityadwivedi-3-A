<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickCart Store</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--ac:#4f46e5;--act:#fff;--ok:#16a34a;--er:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c1f2a;--tx:#eceef5;--mu:#9aa1b2;--bd:#2c3040;--ac:#818cf8;--act:#12141b;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c1f2a;--tx:#eceef5;--mu:#9aa1b2;--bd:#2c3040;--ac:#818cf8;--act:#12141b;--ok:#4ade80;--er:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.sm{padding:4px 10px;font-size:13px}.btn.dn{color:var(--er)}
main{max-width:980px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.pimg{font-size:56px;text-align:center;background:var(--bg);border-radius:10px;padding:14px 0;margin-bottom:10px}
.price{font-weight:700}.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--ac);color:var(--act);border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.ok{color:var(--ok)}.er{color:var(--er)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
</style></head><body>
<header><h1>🛍️ QuickCart</h1>
<nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const seed=[
 {id:1,name:'Wireless Earbuds',price:1999,stock:25,emoji:'🎧',desc:'Bluetooth 5.3, 24-hour battery case.'},
 {id:2,name:'Smart Watch',price:3499,stock:12,emoji:'⌚',desc:'Heart-rate, sleep and step tracking.'},
 {id:3,name:'Backpack',price:1299,stock:40,emoji:'🎒',desc:'Water-resistant, 25L, laptop sleeve.'},
 {id:4,name:'Running Shoes',price:2799,stock:18,emoji:'👟',desc:'Lightweight, breathable mesh.'},
 {id:5,name:'Coffee Mug',price:349,stock:80,emoji:'☕',desc:'Ceramic, 350 ml, dishwasher safe.'},
 {id:6,name:'Desk Lamp',price:899,stock:0,emoji:'💡',desc:'LED, three brightness levels.'}];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let products=ld('qc_products',seed),cart=ld('qc_cart',{}),orders=ld('qc_orders',[]);
let view='shop',admin=false,editId=null,msg='',lastOrder=null;
const SELLER_PIN='admin123';
const save=()=>{sv('qc_products',products);sv('qc_cart',cart);sv('qc_orders',orders)};
const cartItems=()=>Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id==id),q})).filter(i=>i.p);
const total=()=>cartItems().reduce((s,i)=>s+i.p.price*i.q,0);
const count=()=>cartItems().reduce((s,i)=>s+i.q,0);
function go(v){view=v;msg='';render()}
function add(id){const p=products.find(x=>x.id==id);const q=(cart[id]||0)+1;if(q>p.stock){alert('Only '+p.stock+' in stock.');return}cart[id]=q;save();render()}
function setQ(id,d){const p=products.find(x=>x.id==id);const q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(q<=p.stock)cart[id]=q;save();render()}
function nav(){const t=[['shop','Shop'],['cart','Cart'+(count()?`<span class="badge">${count()}</span>`:'')],['orders','Orders'],['seller','Seller panel']];
 $('#nav').innerHTML=t.map(([k,l])=>`<button class="${view===k||(view==='checkout'&&k==='cart')?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function shop(){return `<div class="grid">${products.map(p=>`<div class="card"><div class="pimg">${esc(p.emoji)}</div><b>${esc(p.name)}</b><div class="mu">${esc(p.desc)}</div>
<div class="row" style="border:0"><span class="price">${inr(p.price)}</span>${p.stock>0?`<button class="btn pri sm" onclick="add(${p.id})">Add to cart</button>`:'<span class="er">Out of stock</span>'}</div>
<div class="mu">${p.stock>0?p.stock+' left':''}</div></div>`).join('')||'<p>No products yet.</p>'}</div>`}
function cartV(){const it=cartItems();if(!it.length)return `<div class="card">Your cart is empty. <a href="#" onclick="go('shop');return false">Browse products</a></div>`;
 return `<div class="card">${it.map(({p,q})=>`<div class="row"><span>${esc(p.emoji)} <b>${esc(p.name)}</b><br><span class="mu">${inr(p.price)} each</span></span>
<span class="qty"><button class="btn sm" onclick="setQ(${p.id},-1)">−</button>${q}<button class="btn sm" onclick="setQ(${p.id},1)">+</button></span><b>${inr(p.price*q)}</b></div>`).join('')}
<div class="row" style="border:0"><b>Total</b><b>${inr(total())}</b></div><button class="btn pri" onclick="go('checkout')">Proceed to payment</button></div>`}
function checkout(){if(!count())return cartV();
 return `<div class="card" style="max-width:520px"><h3 style="margin-top:0">Payment · ${inr(total())}</h3>
<p class="mu">Demo payment: no real money moves and no card details are saved.</p>
<label>Full name</label><input id="cn"><label>Delivery address</label><textarea id="ca" rows="2"></textarea>
<label>Payment method</label><select id="pm" onchange="pmChange()"><option value="card">Credit/Debit card</option><option value="upi">UPI</option><option value="cod">Cash on delivery</option></select>
<div id="pf"></div><p id="perr" class="er"></p><button class="btn pri" id="pay" onclick="pay()">Pay ${inr(total())}</button></div>`}
function pmChange(){const m=$('#pm').value;$('#pf').innerHTML=m==='card'?`<label>Card number</label><input id="cc" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"><div class="two"><div><label>Expiry (MM/YY)</label><input id="ce" placeholder="08/29" maxlength="5"></div><div><label>CVV</label><input id="cv" type="password" maxlength="4"></div></div>`:m==='upi'?`<label>UPI ID</label><input id="cu" placeholder="name@bank">`:'<p class="mu">Pay in cash when your order arrives.</p>'}
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function pay(){const e=m=>{$('#perr').textContent=m;return};const nm=$('#cn').value.trim(),ad=$('#ca').value.trim(),m=$('#pm').value;
 if(!nm||!ad)return e('Please enter your name and address.');
 if(m==='card'){const n=$('#cc').value.replace(/\s/g,'');if(!/^\d{13,19}$/.test(n)||!luhn(n))return e('Enter a valid card number (try 4242 4242 4242 4242).');
  if(!/^(0[1-9]|1[0-2])\/\d\d$/.test($('#ce').value))return e('Enter expiry as MM/YY.');if(!/^\d{3,4}$/.test($('#cv').value))return e('Enter a valid CVV.')}
 if(m==='upi'&&!/^[\w.\-]+@[\w]+$/.test($('#cu').value.trim()))return e('Enter a valid UPI ID.');
 $('#pay').disabled=true;$('#pay').textContent='Processing…';
 setTimeout(()=>{const items=cartItems();
  items.forEach(({p,q})=>{p.stock-=q});
  const o={id:'ORD'+Date.now().toString().slice(-8),date:new Date().toLocaleString('en-IN'),name:nm,address:ad,method:{card:'Card',upi:'UPI',cod:'Cash on delivery'}[m],status:m==='cod'?'Placed':'Paid',total:total(),items:items.map(({p,q})=>({name:p.name,emoji:p.emoji,price:p.price,q}))};
  orders.unshift(o);cart={};save();lastOrder=o.id;view='orders';render()},1100)}
function ordersV(){const b=lastOrder?`<div class="card ok" style="margin-bottom:14px">✅ Order ${lastOrder} placed successfully. Thank you!</div>`:'';
 if(!orders.length)return '<div class="card">No orders yet.</div>';
 return b+orders.map(o=>`<div class="card" style="margin-bottom:12px"><div class="row" style="border:0;padding-top:0"><b>${o.id}</b><span class="ok">● ${o.status}</span></div>
<div class="mu">${o.date} · ${esc(o.method)} · Ship to ${esc(o.name)}, ${esc(o.address)}</div>
${o.items.map(i=>`<div class="row"><span>${esc(i.emoji)} ${esc(i.name)} × ${i.q}</span><span>${inr(i.price*i.q)}</span></div>`).join('')}
<div class="row" style="border:0"><b>Total</b><b>${inr(o.total)}</b></div></div>`).join('')}
function sellerV(){if(!admin)return `<div class="card" style="max-width:360px"><h3 style="margin-top:0">Seller login</h3><label>PIN</label><input id="pin" type="password" onkeydown="if(event.key==='Enter')login()"><p class="er">${msg}</p><button class="btn pri" onclick="login()">Enter</button><p class="mu">Demo PIN: admin123. This is a front-end demo only; real stores need server-side authentication.</p></div>`;
 const p=products.find(x=>x.id===editId)||{name:'',price:'',stock:'',emoji:'📦',desc:''};
 return `<div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">${editId?'Edit product':'Add product'}</h3>
<div class="two"><div><label>Name</label><input id="fn" value="${esc(p.name)}"></div><div><label>Emoji icon</label><input id="fe" value="${esc(p.emoji)}" maxlength="4"></div>
<div><label>Price (₹)</label><input id="fp" type="number" min="0" value="${p.price}"></div><div><label>Stock</label><input id="fs" type="number" min="0" value="${p.stock}"></div></div>
<label>Description</label><textarea id="fd" rows="2">${esc(p.desc)}</textarea><p class="er">${msg}</p>
<button class="btn pri" onclick="saveP()">${editId?'Update':'Add product'}</button> ${editId?'<button class="btn" onclick="editId=null;render()">Cancel</button>':''}
<button class="btn" style="float:right" onclick="admin=false;render()">Log out</button></div>
<div class="card scroll"><table><tr><th></th><th>Product</th><th>Price</th><th>Stock</th><th></th></tr>${products.map(x=>`<tr><td>${esc(x.emoji)}</td><td>${esc(x.name)}</td><td>${inr(x.price)}</td><td>${x.stock}</td>
<td style="white-space:nowrap"><button class="btn sm" onclick="editId=${x.id};msg='';render();scrollTo(0,0)">Edit</button> <button class="btn sm dn" onclick="delP(${x.id})">Delete</button></td></tr>`).join('')}</table></div>`}
function login(){if($('#pin').value===SELLER_PIN){admin=true;msg=''}else msg='Incorrect PIN.';render()}
function saveP(){const n=$('#fn').value.trim(),pr=parseFloat($('#fp').value),st=parseInt($('#fs').value);
 if(!n||isNaN(pr)||pr<0||isNaN(st)||st<0){msg='Enter a name, a valid price and a stock count.';render();return}
 const d={name:n,price:pr,stock:st,emoji:$('#fe').value.trim()||'📦',desc:$('#fd').value.trim()};
 if(editId){Object.assign(products.find(x=>x.id===editId),d);Object.keys(cart).forEach(k=>{const q=products.find(x=>x.id==k);if(q&&cart[k]>q.stock){if(q.stock>0)cart[k]=q.stock;else delete cart[k]}})}
 else products.push({id:Date.now(),...d});
 editId=null;msg='';save();render()}
function delP(id){if(!confirm('Delete this product?'))return;products=products.filter(x=>x.id!==id);delete cart[id];save();render()}
function render(){nav();if(view!=='orders')lastOrder=lastOrder&&view==='orders'?lastOrder:null;
 $('#app').innerHTML={shop,cart:cartV,checkout,orders:ordersV,seller:sellerV}[view]();if(view==='checkout')pmChange()}
render();
</script></body></html>
